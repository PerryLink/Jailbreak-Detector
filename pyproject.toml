[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_backend"

[project]
name = "jailbreak-detector"
version = "0.1.0"
description = "High-performance jailbreak prompt detector using Aho-Corasick algorithm"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Chance Dean", email = "novelnexusai@outlook.com"}]
dependencies = [
    "pyahocorasick>=2.1.0",
    "rich>=13.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
jailbreak-detector = "jailbreak_detector.cli:main"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
